<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Download</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-family: system-ui, sans-serif;
      background: #111;
      color: #fff;
    }
    button {
      padding: 14px 32px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background: #4f8cff;
      color: #fff;
      cursor: pointer;
    }
    button:hover { background: #3a75e6; }
  </style>
</head>
<body>
  <h1>Get the files</h1>
  <button id="downloadBtn">Download</button>

  <script>
    document.getElementById("downloadBtn").addEventListener("click", () => {
      const a = document.createElement("a");
      a.href = "files/myfiles.zip";   // path to your zip
      a.download = "myfiles.zip";     // name your friends will get
      a.click();
    });
  </script>
</body>
</html>
